[package]
name = "carry"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "app"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13.5", features = ["json"] }
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs"] }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "time", "sync"] }
futures = "0.3.34"
chrono = "0.4.45"
async-stream = "0.3.6"
polars = { version = "0.55.2", features = ["async", "dtype-datetime", "lazy", "parquet", "dynamic_group_by", "range", "cross_join", "dtype-array"] }
log = "0.4.34"
env_logger = "0.11.11"
fast-arma = { version = "0.1.0", path = "../../../src/fast-arma" }
simba = { version = "0.10.2", features = ["portable_simd"] }
governor = { version = "0.10.4", default-features = false, features = ["jitter", "std"] }
nonzero_ext = "0.3"
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
prost = "0.14.4"

[build-dependencies]
prost-build = "0.14.4"
