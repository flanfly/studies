workerPoolSpecs:
  - machineSpec:
      machineType: g2-standard-4
      acceleratorType: NVIDIA_L4
      acceleratorCount: 1
    replicaCount: 1
    containerSpec:
      imageUri: asia-southeast1-docker.pkg.dev/prj-vertexai-test/default/myimage:latest
scheduling:
  strategy: SPOT
  timeout: 3600s
  restartJobOnWorkerRestart: true
