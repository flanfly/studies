[project]
name = "studies"
version = "0.1.0"
description = "studies on financial time series forecasting"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=7.0.0",
    "aiohttp>=3.13.3",
    "aiostream>=0.7.1",
    "arch>=8.0.0",
    "beautifulsoup4>=4.14.3",
    "betterproto[compiler]>=1.2.5",
    "ccxt>=4.5.54",
    "cloudml-hypertune>=0.1.0.dev6",
    "coingecko-sdk>=2.0.1",
    "databento>=0.75.0",
    "duckdb>=1.4.3",
    "eth-hash[pycryptodome]>=0.8.0",
    "eth-utils>=6.0.0",
    "fastapi>=0.141.1",
    "fsspec>=2026.1.0",
    "gcsfs>=2026.1.0",
    "ghapi>=1.0.13",
    "google-cloud-aiplatform>=1.139.0",
    "google-cloud-storage>=3.7.0",
    "great-tables>=0.21.0",
    "grpcio-tools>=1.81.1",
    "gymnasium>=1.2.3",
    "holidays>=0.93",
    "httpx-ws>=0.9.0",
    "humanize>=4.15.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.1",
    "kfp>=2.16.0",
    "lxml>=6.0.2",
    "matplotlib>=3.10.8",
    "more-itertools>=10.8.0",
    "obstore>=0.9.0",
    "pandas-datareader>=0.10.0",
    "pandas[pyarrow]>=2.3.3",
    "papermill>=2.6.0",
    "parquet-tools>=0.2.16",
    "polars>=1.37.1",
    "polars-ols>=0.3.5",
    "protobuf>=6.33.4",
    "pydantic-xml>=2.21.1",
    "python-dotenv>=1.2.1",
    "python-snappy>=0.7.3",
    "pytimeparse>=1.1.8",
    "requests>=2.32.5",
    "scrapbook>=0.5.0",
    "seaborn>=0.13.2",
    "stable-baselines3[extra]>=2.8.0",
    "tqdm>=4.67.1",
    "tradingview-scraper>=0.4.8",
    "tvdatafeed-enhanced>=2.2.1",
    "ulid-py>=1.1.0",
    "uvicorn>=0.52.4",
    "yfinance>=1.2.0",
]

[tool.mypy]
disable_error_code = ["import-not-found", "import-untyped"]

[tool.black]
line-length = 88
indent-size = 2

[tool.uv.workspace]
members = [
    "backtest_ng",
    "clmm",
    "clmm/polars_eth",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["live/tests"]
