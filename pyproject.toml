[project]
name = "studies"
version = "0.1.0"
description = "studies on financial time series forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aioboto3>=7.0.0",
    "aiohttp>=3.13.3",
    "arch>=8.0.0",
    "binance-sdk-spot>=6.0.0",
    "catboost>=1.2.10",
    "ccxt>=4.5.54",
    "chronos-forecasting>=2.2.2",
    "cloudml-hypertune>=0.1.0.dev6",
    "coingecko-sdk>=2.0.1",
    "databento>=0.75.0",
    "duckdb>=1.4.3",
    "fsspec>=2026.1.0",
    "gcsfs>=2026.1.0",
    "ghapi>=1.0.13",
    "google-cloud-aiplatform>=1.139.0",
    "google-cloud-storage>=3.7.0",
    "great-tables>=0.21.0",
    "holidays>=0.93",
    "humanize>=4.15.0",
    "jupyter>=1.1.1",
    "jupytext>=1.19.1",
    "kfp>=2.16.0",
    "matplotlib>=3.10.8",
    "more-itertools>=10.8.0",
    "obstore>=0.9.0",
    "pandas-datareader>=0.10.0",
    "pandas[pyarrow]>=2.3.3",
    "papermill>=2.6.0",
    "parquet-tools>=0.2.16",
    "playwright>=1.59.0",
    "polars>=1.37.1",
    "python-dotenv>=1.2.1",
    "python-snappy>=0.7.3",
    "python-telegram-bot>=22.7",
    "pytimeparse>=1.1.8",
    "requests>=2.32.5",
    "rpy2>=3.6.7",
    "scrapbook>=0.5.0",
    "seaborn>=0.13.2",
    "simplegmail>=4.1.1",
    "torch<2.4",
    "tqdm>=4.67.1",
    "xgboost>=3.2.0",
    "yfinance>=1.2.0",
]

[tool.mypy]
disable_error_code = ["import-not-found", "import-untyped"]

[tool.black]
line-length = 88
indent-size = 2

[tool.uv.workspace]
members = [
    "ts2vec",
]
