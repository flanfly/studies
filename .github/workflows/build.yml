name: Build and Push to Artifact Registry

on:
  push:
    branches: [ master ]

env:
  PROJECT_ID: prj-vertexai-test
  REGION: asia-southeast1
  REPOSITORY: asia-southeast1-docker.pkg.dev/prj-vertexai-test/default
  IMAGE_NAME: runner
  WIF_PROVIDER: projects/868042038328/locations/global/workloadIdentityPools/github/providers/github
  WIF_SA: github-actions-deployer@prj-vertexai-test.iam.gserviceaccount.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/flanfly/studies
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
