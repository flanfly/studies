name: Build and Push to Artifact Registry

on:
  push:
    branches: [ "master" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/flanfly/studies
  GAR_REGISTRY: asia-southeast1-docker.pkg.dev
  GAR_IMAGE: asia-southeast1-docker.pkg.dev/prj-vertexai-test/default/studies
  WIF_PROVIDER: projects/868042038328/locations/global/workloadIdentityPools/github/providers/github
  WIF_SERVICE_ACCOUNT: github-actions-deployer@prj-vertexai-test.iam.gserviceaccount.com

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GAR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GAR_REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:master
            ${{ env.GAR_IMAGE }}:master
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:build-cache
          cache-to: type=registry,ref=${{ env.IMAGE_NAME }}:build-cache,mode=max

      - name: Image Digest Summary
        run: |
          echo "### 🐳 Container Image Summary" >> $GITHUB_STEP_SUMMARY
          echo "Digest: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          
          echo "#### 📦 Pushed Tags" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | Image | Tags |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| GHCR | \`${{ env.IMAGE_NAME }}\` | \`master\` |" >> $GITHUB_STEP_SUMMARY
          echo "| GAR | \`${{ env.GAR_IMAGE }}\` | \`master\` |" >> $GITHUB_STEP_SUMMARY
          
          echo "#### 🔎 Manifest Inspection" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>GHCR Inspection</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`console" >> $GITHUB_STEP_SUMMARY
          docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:master >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY